<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomesh Movie</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#e50914;
    padding:22px;
    text-align:center;
}

.search{
    text-align:center;
    padding:30px 15px;
}

input{
    width:70%;
    max-width:500px;
    padding:14px;
    border:0;
    border-radius:6px;
    font-size:16px;
}

button{
    padding:14px 20px;
    margin-left:5px;
    border:0;
    border-radius:6px;
    background:#e50914;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.movie{
    display:none;
    background:#222;
    padding:25px;
    border-radius:12px;
    text-align:center;
}

.poster{
    width:250px;
    max-width:90%;
    border-radius:10px;
    margin-bottom:20px;
}

.movie h2{
    color:#ff4444;
}

.movie p{
    color:#ddd;
    line-height:1.6;
}

.rating{
    font-size:20px;
    color:#ffd700;
}

.trailer{
    display:inline-block;
    margin-top:15px;
    padding:13px 22px;
    background:#e50914;
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

#error{
    display:none;
    text-align:center;
    color:#ff7777;
}

</style>
</head>

<body>

<header>
<h1>🎬 Tomesh Movie</h1>
</header>

<div class="search">

<input
id="movieName"
type="text"
placeholder="Movie ka naam likho..."
>

<button onclick="searchMovie()">
🔎 Search
</button>

</div>

<div class="container">

<div id="error">
❌ Movie nahi mili.
</div>

<div id="result" class="movie">

<img id="poster" class="poster" src="" alt="Movie Poster">

<h2 id="title"></h2>

<p id="year"></p>

<p class="rating" id="rating"></p>

<p id="description"></p>

<a
id="trailer"
class="trailer"
target="_blank"
rel="noopener noreferrer"
>
▶️ Official Trailer
</a>

</div>

</div>

<script>

const movies = {

"pushpa 2": {

title:"Pushpa 2: The Rule",

year:"2024",

rating:"⭐ Rating: 6.1/10",

description:
"Pushpa 2: The Rule is a 2024 Indian Telugu-language action drama film directed by Sukumar, starring Allu Arjun, Rashmika Mandanna and Fahadh Faasil.",

poster:
"https://image.tmdb.org/t/p/w500/1m1r6YjN4YbKQvQKfK6bJ6X2Z0.jpg",

trailer:
"https://www.youtube.com/watch?v=1kVK0MZlbI4"

}

};


function searchMovie(){

const name =
document
.getElementById("movieName")
.value
.toLowerCase()
.trim();

const movie = movies[name];

const result =
document.getElementById("result");

const error =
document.getElementById("error");

if(!movie){

result.style.display="none";

error.style.display="block";

return;

}

error.style.display="none";

result.style.display="block";

document
.getElementById("poster")
.src=movie.poster;

document
.getElementById("title")
.innerText="🎬 "+movie.title;

document
.getElementById("year")
.innerText="📅 Year: "+movie.year;

document
.getElementById("rating")
.innerText=movie.rating;

document
.getElementById("description")
.innerText=movie.description;

document
.getElementById("trailer")
.href=movie.trailer;

}

</script>

</body>
</html>
