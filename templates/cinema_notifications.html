<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | CINEMA WORLD</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial}.wrap{max-width:800px;margin:auto;padding:28px 16px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#aaa}.n{padding:14px 0;border-bottom:1px solid #242424}.badge{font-size:11px;color:#ff405c}</style></head><body><div class="wrap"><a href="{{ url_for('member_home') }}" style="color:#fff">← Member Home</a><h1>🔔 Notifications</h1>{% for n in notifications %}<div class="card n"><div class="badge">{{n.kind}}</div><h3>{{n.title}}</h3><p>{{n.message}}</p><small class="muted">{{n.created_at}}</small></div>{% else %}<div class="card muted">No notifications yet.</div>{% endfor %}</div></body></html>
