<!doctype html>
<html lang="hi">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover"
    >

    <title>
        {% block title %}CINEMA WORLD{% endblock %}
    </title>

    <meta
        name="description"
        content="CINEMA WORLD - Movies, entertainment and latest stories."
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8697157365303435"
        crossorigin="anonymous">
    </script>

    <style>

        html{
            scroll-behavior:smooth;
            background:#000;
        }

        body{
            margin:0;
            min-height:100vh;
            background:#000;
            color:#fff;
            overflow-x:hidden;
        }

        *,
        *::before,
        *::after{
            box-sizing:border-box;
        }

        .tm-main{
            position:relative;
            width:100%;
            min-height:100vh;
            background:#000;
        }


        /* =====================================================
           FLASH MESSAGES
        ===================================================== */

        .flash-wrap{
            position:fixed;
            top:20px;
            left:50%;
            z-index:9000;

            width:min(520px,calc(100% - 24px));

            transform:translateX(-50%);

            display:flex;
            flex-direction:column;
            gap:8px;

            pointer-events:none;
        }

        .flash-message{
            padding:13px 16px;

            border:1px solid rgba(255,255,255,.12);
            border-radius:10px;

            background:rgba(18,18,18,.96);
            color:#eee;

            box-shadow:0 18px 45px rgba(0,0,0,.5);

            text-align:center;
            font-size:13px;
            font-weight:700;
        }


        /* =====================================================
           GENERIC LINKS
        ===================================================== */

        a{
            -webkit-tap-highlight-color:transparent;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:700px){

            .flash-wrap{
                top:12px;
            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media(prefers-reduced-motion:reduce){

            html{
                scroll-behavior:auto;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         FLASH MESSAGES
    ===================================================== -->

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <div class="flash-wrap">

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}


    <!-- =====================================================
         PAGE CONTENT

         Header/footer intentionally NOT included here.
         Homepage index.html has its own premium header/footer.
    ===================================================== -->

    <main class="tm-main">

        {% block content %}{% endblock %}

    </main>


</body>

</html>
