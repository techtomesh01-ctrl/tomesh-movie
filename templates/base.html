```html
<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>{% block title %}Tomesh Movies{% endblock %}</title>

    <meta name="description"
          content="Tomesh Movies - Movies, entertainment and latest stories.">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* =====================================================
           TOMESH MOVIES - PREMIUM OPENING ANIMATION
        ===================================================== */

        #tm-intro {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 45%,
                    rgba(130, 60, 255, .20),
                    transparent 28%),
                radial-gradient(circle at 20% 80%,
                    rgba(255, 0, 80, .12),
                    transparent 30%),
                #050505;
            animation: tmIntroOut .9s ease 2.7s forwards;
            pointer-events: none;
        }

        #tm-intro::before {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            border: 1px solid rgba(255, 193, 7, .20);
            box-shadow:
                0 0 50px rgba(255, 193, 7, .10),
                inset 0 0 50px rgba(150, 50, 255, .08);
            animation: tmRing 2.4s ease-in-out infinite;
        }

        #tm-intro::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(139, 60, 255, .18);
            filter: blur(65px);
            animation: tmGlow 1.8s ease-in-out infinite alternate;
        }

        .tm-intro-content {
            position: relative;
            z-index: 3;
            text-align: center;
            animation: tmLogoIn 1.2s cubic-bezier(.2,.8,.2,1);
        }

        .tm-film-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border: 2px solid rgba(255, 193, 7, .9);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #ffc107;
            background: rgba(255,255,255,.035);
            box-shadow:
                0 0 20px rgba(255,193,7,.25),
                0 0 70px rgba(126,50,255,.15);
            animation: tmIconFloat 2s ease-in-out infinite;
        }

        .tm-intro-title {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(36px, 8vw, 76px);
            font-weight: 900;
            letter-spacing: 5px;
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
            text-shadow:
                0 0 10px rgba(255,255,255,.25),
                0 0 30px rgba(255,193,7,.20);
        }

        .tm-intro-title span {
            color: #ffc107;
        }

        .tm-intro-subtitle {
            margin-top: 16px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255,255,255,.62);
            animation: tmSubIn 1.5s ease .35s both;
        }

        .tm-intro-line {
            width: 0;
            height: 2px;
            margin: 23px auto 0;
            background: linear-gradient(
                90deg,
                transparent,
                #ffc107,
                #9c4dff,
                transparent
            );
            animation: tmLine 1.4s ease .5s forwards;
        }

        /* cinematic moving light */
        .tm-light {
            position: absolute;
            width: 2px;
            height: 180px;
            background: linear-gradient(
                transparent,
                rgba(255,193,7,.7),
                transparent
            );
            transform: rotate(35deg);
            filter: blur(1px);
            opacity: 0;
        }

        .tm-light.one {
            left: 15%;
            animation: tmLight 2.5s linear .2s infinite;
        }

        .tm-light.two {
            right: 20%;
            animation: tmLight 3s linear 1s infinite;
        }

        /* particles */
        .tm-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #ffc107;
            opacity: 0;
            box-shadow: 0 0 10px #ffc107;
        }

        .tm-p1 {
            left: 15%;
            top: 30%;
            animation: tmParticle 2.8s ease-in-out infinite;
        }

        .tm-p2 {
            left: 80%;
            top: 25%;
            animation: tmParticle 3.4s ease-in-out .5s infinite;
        }

        .tm-p3 {
            left: 25%;
            top: 75%;
            animation: tmParticle 3s ease-in-out 1s infinite;
        }

        .tm-p4 {
            left: 72%;
            top: 72%;
            animation: tmParticle 3.7s ease-in-out .8s infinite;
        }

        @keyframes tmLogoIn {
            0% {
                opacity: 0;
                transform: scale(.65) translateY(20px);
                filter: blur(12px);
            }
            65% {
                opacity: 1;
                transform: scale(1.05);
                filter: blur(0);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes tmSubIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes tmLine {
            from {
                width: 0;
                opacity: 0;
            }
            to {
                width: 260px;
                opacity: 1;
            }
        }

        @keyframes tmRing {
            0%,100% {
                transform: scale(.92);
                opacity: .45;
            }
            50% {
                transform: scale(1.05);
                opacity: .8;
            }
        }

        @keyframes tmGlow {
            from {
                transform: scale(.8);
                opacity: .5;
            }
            to {
                transform: scale(1.35);
                opacity: .9;
            }
        }

        @keyframes tmIconFloat {
            0%,100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-7px) rotate(2deg);
            }
        }

        @keyframes tmLight {
            0% {
                transform: translateY(120vh) rotate(35deg);
                opacity: 0;
            }
            15% {
                opacity: .7;
            }
            80% {
                opacity: .2;
            }
            100% {
                transform: translateY(-120vh) rotate(35deg);
                opacity: 0;
            }
        }

        @keyframes tmParticle {
            0%,100% {
                transform: translateY(0) scale(.5);
                opacity: 0;
            }
            40% {
                opacity: .8;
            }
            70% {
                transform: translateY(-35px) scale(1.2);
                opacity: .4;
            }
        }

        @keyframes tmIntroOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            75% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            #tm-intro::before {
                width: 320px;
                height: 320px;
            }

            .tm-intro-title {
                font-size: 38px;
                letter-spacing: 3px;
            }

            .tm-intro-subtitle {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .tm-film-icon {
                width: 62px;
                height: 62px;
                font-size: 29px;
            }

            .tm-intro-line {
                margin-top: 18px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            #tm-intro {
                animation: tmIntroOut .3s ease .7s forwards;
            }

            #tm-intro *,
            #tm-intro::before,
            #tm-intro::after {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

<!-- =========================================================
     PREMIUM OPENING
========================================================= -->

<div id="tm-intro" aria-hidden="true">

    <div class="tm-light one"></div>
    <div class="tm-light two"></div>

    <div class="tm-particle tm-p1"></div>
    <div class="tm-particle tm-p2"></div>
    <div class="tm-particle tm-p3"></div>
    <div class="tm-particle tm-p4"></div>

    <div class="tm-intro-content">

        <div class="tm-film-icon">🎬</div>

        <h1 class="tm-intro-title">
            TOMESH <span>MOVIES</span>
        </h1>

        <div class="tm-intro-subtitle">
            YOUR CINEMATIC WORLD
        </div>

        <div class="tm-intro-line"></div>

    </div>

</div>


{% with messages = get_flashed_messages() %}
    {% if messages %}
        <div class="flash-wrap">
            {% for message in messages %}
                <div class="flash-message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}


{% block content %}{% endblock %}


<script>
    /* =====================================================
       TOMESH MOVIES - INTRO CLEANUP
    ===================================================== */

    window.addEventListener("load", function () {

        setTimeout(function () {

            const intro = document.getElementById("tm-intro");

            if (intro) {
                intro.remove();
            }

        }, 3800);

    });
</script>

</body>
</html>
```
