<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Movie | CINEMA WORLD</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 16px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:20px;margin:14px 0}input,button{padding:12px;border-radius:10px;border:1px solid #333;background:#171717;color:#fff}input{width:70%;box-sizing:border-box}button{cursor:pointer;background:#b40018;border-color:#d00020}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#aaa}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #242424}</style></head><body><div class="wrap"><a href="{{ url_for('member_home') }}" style="color:#fff">← Member Home</a><div class="card"><h1>🎬 Request a Movie</h1><p class="muted">Movie search me nahi mile to naam yahan bhejo. Admin ko demand count dikhega.</p><form method="post" class="row"><input name="title" maxlength="180" placeholder="Movie / Web Series name" required><button>Send Request</button></form></div><div class="card"><h2>🔥 Most Requested</h2>{% for r in requests_list %}<div class="item"><span>{{ r.requested_title }}</span><b>{{ r.votes }} request{{ '' if r.votes == 1 else 's' }}</b></div>{% else %}<p class="muted">Abhi koi request nahi.</p>{% endfor %}</div></div></body></html>
