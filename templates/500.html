<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tomesh Movies - Error</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 30%, #32105f, transparent 35%),
                #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .box {
            width: min(600px, 100%);
            padding: 45px 25px;
            border: 1px solid rgba(255,193,7,.35);
            border-radius: 24px;
            background: rgba(255,255,255,.04);
            box-shadow:
                0 0 40px rgba(156,77,255,.18),
                inset 0 0 30px rgba(255,255,255,.02);
        }

        .icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 42px;
            color: #ffc107;
        }

        p {
            color: rgba(255,255,255,.7);
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            border-radius: 12px;
            background: #ffc107;
            color: #111;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            background: white;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon">🎬</div>

    <h1>Something went wrong</h1>

    <p>
        Tomesh Movies में temporary server error आया है.
        कृपया थोड़ी देर बाद फिर कोशिश करें।
    </p>

    <a href="/">← Home पर जाएँ</a>

</div>

</body>
</html>
