<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tomesh Movies</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            font-family:Arial,Helvetica,sans-serif;
            color:#fff;
            background:
                radial-gradient(circle at 15% 10%,rgba(255,193,7,.16),transparent 30%),
                radial-gradient(circle at 85% 90%,rgba(130,30,220,.20),transparent 30%),
                #050505;
        }

        .admin-box{
            width:100%;
            max-width:430px;
            padding:40px 32px;
            background:#101010;
            border:1px solid rgba(255,193,7,.35);
            border-radius:22px;
            box-shadow:0 0 60px rgba(255,193,7,.10);
        }

        .icon{
            width:72px;
            height:72px;
            margin:0 auto 18px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:50%;
            background:linear-gradient(135deg,#ffc107,#ff8c00);
            font-size:30px;
        }

        .logo{
            text-align:center;
            color:#ffc107;
            font-size:28px;
            font-weight:900;
            letter-spacing:2px;
        }

        .subtitle{
            text-align:center;
            color:#999;
            font-size:13px;
            margin-top:7px;
            margin-bottom:30px;
        }

        label{
            display:block;
            color:#ddd;
            font-size:14px;
            font-weight:700;
            margin-bottom:8px;
        }

        input{
            width:100%;
            padding:14px;
            margin-bottom:18px;
            border:1px solid #333;
            border-radius:12px;
            outline:none;
            background:#080808;
            color:#fff;
            font-size:15px;
        }

        input:focus{
            border-color:#ffc107;
            box-shadow:0 0 0 3px rgba(255,193,7,.08);
        }

        button{
            width:100%;
            padding:14px;
            border:0;
            border-radius:12px;
            background:linear-gradient(135deg,#ffc107,#ff9800);
            color:#111;
            font-size:16px;
            font-weight:900;
            cursor:pointer;
        }

        button:hover{
            box-shadow:0 8px 25px rgba(255,193,7,.20);
        }

        .back{
            display:block;
            text-align:center;
            margin-top:22px;
            color:#888;
            text-decoration:none;
            font-size:14px;
        }

        .back:hover{
            color:#ffc107;
        }

        .flash{
            padding:12px;
            margin-bottom:18px;
            border-radius:10px;
            background:#2a1111;
            border:1px solid #6b2222;
            color:#ff8a8a;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="admin-box">

    <div class="icon">🔐</div>

    <div class="logo">TOMESH MOVIES</div>

    <div class="subtitle">
        ADMIN CONTROL CENTER
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}">

        <label>Admin Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            autocomplete="username"
            required
        >

        <label>Admin Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            LOGIN TO ADMIN PANEL
        </button>

    </form>

    <a class="back" href="{{ url_for('home') }}">
        ← Back to Tomesh Movies
    </a>

</div>

</body>
</html>
