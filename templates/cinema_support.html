<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support | CINEMA WORLD</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial}.wrap{max-width:850px;margin:auto;padding:28px 16px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin:12px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #333;background:#171717;color:#fff}textarea{min-height:130px}button{background:#b40018;cursor:pointer}.muted{color:#aaa}.ticket{border-top:1px solid #292929;padding:14px 0}</style></head><body><div class="wrap"><a href="{{ url_for('member_home') }}" style="color:#fff">← Member Home</a><h1>🎫 CINEMA WORLD Support</h1><div class="card"><form method="post"><input name="subject" maxlength="160" placeholder="Problem subject" required><textarea name="message" maxlength="3000" placeholder="Problem detail..." required></textarea><button>Create Support Ticket</button></form></div>{% for t in tickets %}<div class="card ticket"><b>#{{t.id}} — {{t.subject}}</b><p>{{t.message}}</p><div class="muted">Status: {{t.status}} · {{t.created_at}}</div>{% if t.admin_reply %}<div style="margin-top:12px;padding:12px;border-radius:10px;background:#181818"><b>Admin Reply</b><p>{{t.admin_reply}}</p></div>{% endif %}</div>{% else %}<div class="card muted">No support tickets.</div>{% endfor %}</div></body></html>
