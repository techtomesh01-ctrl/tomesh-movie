{% extends "base.html" %}

{% block title %}{{ movie.title }} | Tomesh Movies{% endblock %}

{% block content %}

<div style="
    min-height:100vh;
    background:#050505;
    color:white;
    padding:20px;
">

    <div style="
        max-width:1100px;
        margin:auto;
        background:#111;
        border-radius:16px;
        overflow:hidden;
    ">

        <div style="
            background:#000;
            width:100%;
            aspect-ratio:16/9;
        ">

            <video
                id="tmVideo"
                controls
                playsinline
                preload="metadata"
                style="
                    width:100%;
                    height:100%;
                    display:block;
                    background:#000;
                "
                poster="{{ movie.poster_url or movie.poster or '' }}"
            >
                <source
                    src="{{ url_for('stream_movie', movie_id=movie.id) }}"
                    type="video/mp4"
                >

                Your browser does not support HTML5 video.
            </video>

        </div>

        <div style="padding:20px;">
            <h1 style="margin-top:0;">
                {{ movie.title }}
            </h1>

            <p style="color:#aaa;">
                Direct Stream Test
            </p>

            <p>
                Stream URL:
                <br>
                <code style="color:#0f0;">
                    {{ url_for('stream_movie', movie_id=movie.id) }}
                </code>
            </p>
        </div>

    </div>

</div>

{% endblock %}
