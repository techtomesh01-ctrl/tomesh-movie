<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Stats | CINEMA WORLD</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial}.wrap{max-width:900px;margin:auto;padding:28px 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:20px}.num{font-size:32px;font-weight:800}.muted{color:#aaa}</style></head><body><div class="wrap"><a href="{{ url_for('member_home') }}" style="color:#fff">← Member Home</a><h1>🎬 My Cinema Stats</h1><div class="grid">{% for key,label in [('payments','Paid Orders'),('my_list','My List'),('ratings','Ratings'),('likes','Liked Movies'),('requests','Movie Requests'),('tickets','Support Tickets'),('watch_events','Watch Events')] %}<div class="card"><div class="muted">{{label}}</div><div class="num">{{stats[key]}}</div></div>{% endfor %}</div></div></body></html>
