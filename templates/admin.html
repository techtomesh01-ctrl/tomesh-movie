{% extends "base.html" %}
{% block title %}Admin Dashboard | Tomesh Movies{% endblock %}

{% block content %}

<style>
/* =========================================================
   TOMESH MOVIES — COLORFUL PREMIUM ADMIN PANEL
   BLACK + GOLD + PURPLE + RED
========================================================= */

:root{
    --tm-bg:#050608;
    --tm-card:#10131c;
    --tm-card2:#0b0e15;
    --tm-gold:#ffc107;
    --tm-gold2:#ff9f00;
    --tm-purple:#8b5cf6;
    --tm-purple2:#a855f7;
    --tm-red:#ef233c;
    --tm-blue:#38bdf8;
    --tm-green:#22c55e;
    --tm-text:#f8fafc;
    --tm-muted:#9299aa;
    --tm-border:rgba(255,255,255,.09);
}

/* =========================================================
   PAGE
========================================================= */

.tm-admin-page{
    width:100%;
    max-width:1250px;
    margin:0 auto;
    padding:28px 18px 70px;
    color:var(--tm-text);
}

/* =========================================================
   TOP HEADER
========================================================= */

.admin-topbar{
    position:relative;
    overflow:hidden;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;

    padding:30px;
    margin-bottom:22px;

    border:1px solid rgba(255,193,7,.18);
    border-radius:25px;

    background:
        radial-gradient(
            circle at 90% 10%,
            rgba(139,92,246,.25),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 100%,
            rgba(239,35,60,.15),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #151923,
            #0b0e15
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.03);
}

.admin-topbar:after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-80px;
    top:-100px;
    border-radius:50%;

    background:rgba(255,193,7,.10);
    filter:blur(5px);
}

.admin-kicker{
    color:#b7a9ff;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:8px;
}

.admin-topbar h1{
    margin:0;
    font-size:clamp(28px,4vw,42px);
    font-weight:950;
    letter-spacing:-1.5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffc107,
            #ff9f00
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.admin-topbar p{
    margin:9px 0 0;
    color:#a8afbd;
    font-size:14px;
}

.admin-actions{
    position:relative;
    z-index:2;

    display:flex;
    gap:10px;
}

.admin-actions a{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:12px 18px;

    border-radius:12px;

    font-size:13px;
    font-weight:900;

    transition:.25s;
}

.admin-actions a:hover{
    transform:translateY(-3px);
}

.admin-home-btn{
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #252a36,
            #171b24
        );

    border:1px solid rgba(255,255,255,.09);
}

.admin-logout-btn{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff263d,
            #b9001a
        );

    border:1px solid rgba(255,60,80,.25);

    box-shadow:
        0 8px 28px rgba(239,35,60,.25);
}

/* =========================================================
   STATS
========================================================= */

.admin-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:22px;
}

.admin-stat-card{
    position:relative;
    overflow:hidden;

    min-height:112px;
    padding:20px;

    display:flex;
    align-items:center;
    gap:15px;

    border:1px solid var(--tm-border);
    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            transparent
        ),
        var(--tm-card);

    box-shadow:
        0 15px 45px rgba(0,0,0,.28);

    transition:.25s;
}

.admin-stat-card:hover{
    transform:translateY(-4px);

    border-color:
        rgba(255,193,7,.22);

    box-shadow:
        0 18px 50px rgba(0,0,0,.4);
}

.admin-stat-card:nth-child(1){
    border-top:2px solid var(--tm-gold);
}

.admin-stat-card:nth-child(2){
    border-top:2px solid var(--tm-purple);
}

.admin-stat-card:nth-child(3){
    border-top:2px solid var(--tm-blue);
}

.admin-stat-card:nth-child(4){
    border-top:2px solid var(--tm-green);
}

.admin-stat-icon{
    width:52px;
    height:52px;
    flex-shrink:0;

    display:grid;
    place-items:center;

    border-radius:15px;

    font-size:22px;

    background:
        linear-gradient(
            135deg,
            rgba(255,193,7,.16),
            rgba(139,92,246,.13)
        );

    border:1px solid rgba(255,193,7,.16);
}

.admin-stat-card:nth-child(2) .admin-stat-icon{
    background:rgba(139,92,246,.13);
    border-color:rgba(139,92,246,.25);
}

.admin-stat-card:nth-child(3) .admin-stat-icon{
    background:rgba(56,189,248,.10);
    border-color:rgba(56,189,248,.20);
}

.admin-stat-card:nth-child(4) .admin-stat-icon{
    background:rgba(34,197,94,.10);
    border-color:rgba(34,197,94,.20);
}

.admin-stat-card span{
    display:block;
    color:#8991a3;
    font-size:12px;
    font-weight:700;
}

.admin-stat-card strong{
    display:block;
    margin-top:4px;

    font-size:26px;
    font-weight:950;
}

/* =========================================================
   MAIN CARD
========================================================= */

.admin-card{
    position:relative;

    margin-bottom:22px;
    padding:28px;

    border:1px solid var(--tm-border);
    border-radius:24px;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(139,92,246,.06),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            transparent
        ),
        var(--tm-card);

    box-shadow:
        0 18px 60px rgba(0,0,0,.32);
}

.admin-card:hover{
    border-color:rgba(255,193,7,.12);
}

.admin-card-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:25px;
}

.card-kicker{
    color:#a78bfa;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:8px;
}

.admin-card-header h2{
    margin:0;

    font-size:25px;
    font-weight:950;
}

.admin-card-header p{
    margin:7px 0 0;

    color:var(--tm-muted);
    font-size:13px;
}

.secure-badge,
.ads-badge,
.movie-count-badge{
    padding:9px 13px;

    border-radius:11px;

    font-size:11px;
    font-weight:900;
}

.secure-badge{
    color:#ffc107;
    background:rgba(255,193,7,.08);
    border:1px solid rgba(255,193,7,.20);
}

.ads-badge{
    color:#38bdf8;
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.20);
}

.movie-count-badge{
    color:#a78bfa;
    background:rgba(139,92,246,.08);
    border:1px solid rgba(139,92,246,.20);
}

/* =========================================================
   FORM
========================================================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label,
.file-card label{
    display:block;

    margin-bottom:9px;

    color:#e6e9ef;

    font-size:13px;
    font-weight:900;
}

.form-group input,
.form-group textarea{
    width:100%;

    padding:14px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:13px;

    outline:none;

    color:#fff;

    background:#080b11;

    font:inherit;

    transition:.2s;
}

.form-group input::placeholder,
.form-group textarea::placeholder{
    color:#555d6e;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:rgba(255,193,7,.65);

    box-shadow:
        0 0 0 3px rgba(255,193,7,.08);
}

.form-group textarea{
    min-height:125px;
    resize:vertical;
}

/* =========================================================
   FILE UPLOAD
========================================================= */

.file-upload-grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:16px;

    margin:2px 0 20px;
}

.file-card{
    display:flex;
    align-items:center;

    gap:15px;

    padding:19px;

    border:1px dashed rgba(255,255,255,.14);
    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            #090c12,
            #0d1018
        );

    transition:.25s;
}

.file-card:hover{
    transform:translateY(-2px);

    border-color:
        rgba(255,193,7,.5);

    background:#0d1119;
}

.file-card:first-child:hover{
    border-color:rgba(139,92,246,.6);
}

.file-card-icon{
    width:52px;
    height:52px;
    flex-shrink:0;

    display:grid;
    place-items:center;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            rgba(255,193,7,.15),
            rgba(239,35,60,.10)
        );

    border:1px solid rgba(255,193,7,.15);

    font-size:22px;
}

.file-card:first-child .file-card-icon{
    background:rgba(139,92,246,.13);
    border-color:rgba(139,92,246,.20);
}

.file-card-content{
    width:100%;
    min-width:0;
}

.file-card-content p{
    margin:-3px 0 9px;

    color:#747c8e;

    font-size:11px;
}

.file-card input[type=file]{
    width:100%;
    color:#969eae;
    font-size:11px;
}

/* =========================================================
   SELECTED FILE
========================================================= */

.selected-file-info{
    align-items:center;
    gap:13px;

    padding:15px;
    margin:15px 0;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            rgba(255,193,7,.05),
            rgba(139,92,246,.05)
        );

    border:1px solid rgba(255,193,7,.15);
}

.selected-file-icon{
    width:45px;
    height:45px;

    display:grid;
    place-items:center;

    flex-shrink:0;

    border-radius:12px;

    background:rgba(255,193,7,.09);
}

.selected-file-info strong{
    display:block;
    margin-bottom:5px;
}

.selected-file-info span{
    display:inline-block;
    margin-right:12px;

    color:#7f8798;

    font-size:11px;
}

/* =========================================================
   R2 UPLOAD
========================================================= */

.r2-upload-box{
    margin-top:20px;

    padding:21px;

    border-radius:20px;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(139,92,246,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(255,193,7,.07),
            transparent 30%
        ),
        #090c12;

    border:1px solid rgba(139,92,246,.22);
}

.upload-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:15px;
}

.upload-label{
    display:block;

    color:#a78bfa;

    font-size:10px;
    letter-spacing:1.5px;
    font-weight:900;

    margin-bottom:5px;
}

.upload-percent{
    color:#ffc107;
    font-size:25px!important;
}

.progress-track{
    height:10px;
    width:100%;

    overflow:hidden;

    border-radius:20px;

    background:#1a1e27;
}

.progress-fill{
    width:0;
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #8b5cf6,
            #ffc107,
            #ff3b4d
        );

    box-shadow:
        0 0 18px rgba(255,193,7,.45);

    transition:width .2s;
}

.upload-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:10px;

    margin-top:17px;
}

.upload-stat{
    padding:12px;

    border-radius:13px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.04);
}

.upload-stat span{
    display:block;

    color:#747d8f;

    font-size:10px;
}

.upload-stat strong{
    display:block;

    margin-top:4px;

    font-size:13px;
}

.retry-message{
    margin-top:14px;

    padding:12px;

    border-radius:11px;

    color:#ff6b73;

    background:rgba(239,35,60,.07);

    border:1px solid rgba(239,35,60,.10);

    font-size:12px;
}

.cancel-upload-btn{
    margin-top:15px;

    padding:11px 16px;

    border:1px solid rgba(239,35,60,.25);
    border-radius:11px;

    color:#fff;

    background:#201116;

    cursor:pointer;

    font-weight:900;
}

.cancel-upload-btn:hover{
    background:#35151a;
}

/* =========================================================
   FEATURES
========================================================= */

.upload-features{
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:9px;

    margin-top:17px;
}

.upload-features div{
    padding:12px 8px;

    border:1px solid rgba(255,255,255,.05);
    border-radius:12px;

    color:#9aa2b1;

    background:#0b0e14;

    text-align:center;

    font-size:11px;

    transition:.2s;
}

.upload-features div:hover{
    color:#fff;

    border-color:
        rgba(255,193,7,.20);

    transform:translateY(-2px);
}

/* =========================================================
   PUBLISH
========================================================= */

.publish-area{
    display:flex;
    justify-content:flex-end;

    margin-top:20px;
}

.publish{
    padding:14px 28px;

    border:0;
    border-radius:14px;

    color:#080808;

    background:
        linear-gradient(
            135deg,
            #ffd54a,
            #ffb300
        );

    box-shadow:
        0 10px 30px rgba(255,193,7,.22);

    cursor:pointer;

    font-size:14px;
    font-weight:950;

    transition:.2s;
}

.publish:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 35px rgba(255,193,7,.35);
}

.publish:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================================================
   ADS
========================================================= */

.ads-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:15px;
}

.ads-grid textarea{
    min-height:160px;
}

.save-ads-btn{
    padding:12px 20px;

    border:0;
    border-radius:12px;

    color:#050505;

    background:
        linear-gradient(
            135deg,
            #38bdf8,
            #8b5cf6
        );

    cursor:pointer;

    font-weight:900;

    box-shadow:
        0 8px 25px rgba(139,92,246,.20);
}

.save-ads-btn:hover{
    transform:translateY(-2px);
}

/* =========================================================
   MOVIE TABLE
========================================================= */

.admin-table-wrapper{
    overflow-x:auto;
}

.admin-movie-table{
    width:100%;

    border-collapse:collapse;
}

.admin-movie-table th{
    padding:12px;

    color:#747c8e;

    text-align:left;

    font-size:10px;

    letter-spacing:1px;

    text-transform:uppercase;

    border-bottom:
        1px solid rgba(255,255,255,.07);
}

.admin-movie-table td{
    padding:15px 12px;

    border-bottom:
        1px solid rgba(255,255,255,.05);
}

.admin-movie-table tbody tr{
    transition:.2s;
}

.admin-movie-table tbody tr:hover{
    background:
        linear-gradient(
            90deg,
            rgba(255,193,7,.035),
            rgba(139,92,246,.025)
        );
}

.movie-title-cell{
    display:flex;
    align-items:center;
    gap:12px;
}

.movie-mini-icon{
    width:42px;
    height:42px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            rgba(255,193,7,.12),
            rgba(139,92,246,.10)
        );

    border:1px solid rgba(255,193,7,.10);
}

.movie-title-cell strong{
    display:block;
    font-size:13px;
}

.movie-title-cell span{
    display:block;

    margin-top:4px;

    color:#747d8e;

    font-size:11px;
}

.views-cell{
    color:#b7bdc9;

    font-size:12px;
    font-weight:800;
}

.danger{
    padding:9px 12px;

    border:1px solid rgba(239,35,60,.16);
    border-radius:10px;

    color:#ff6b73;

    background:#160d11;

    cursor:pointer;

    font-size:11px;
    font-weight:900;
}

.danger:hover{
    background:#301217;
}

.empty-movies{
    padding:35px!important;

    color:#737c8d;

    text-align:center;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    .admin-stats{
        grid-template-columns:repeat(2,1fr);
    }

    .file-upload-grid,
    .ads-grid{
        grid-template-columns:1fr;
    }

    .upload-features{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){

    .tm-admin-page{
        padding:12px 10px 40px;
    }

    .admin-topbar,
    .admin-card{
        padding:18px;
        border-radius:18px;
    }

    .admin-topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .admin-actions{
        width:100%;
    }

    .admin-actions a{
        flex:1;
        text-align:center;
    }

    .admin-stats{
        gap:9px;
    }

    .admin-stat-card{
        min-height:88px;
        padding:13px;
        gap:9px;
    }

    .admin-stat-icon{
        width:40px;
        height:40px;
    }

    .admin-stat-card strong{
        font-size:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .upload-stats{
        grid-template-columns:1fr;
    }

    .publish-area{
        display:block;
    }

    .publish{
        width:100%;
    }

    .admin-card-header{
        flex-direction:column;
    }

    .admin-movie-table th:nth-child(2),
    .admin-movie-table td:nth-child(2){
        display:none;
    }
}
</style>

<div class="tm-admin-page">

<!-- =========================================================
     HEADER
========================================================= -->

<div class="admin-topbar">

<div>
    <div class="admin-kicker">
        TOMESH MOVIES • CONTROL CENTER
    </div>

    <h1>⚙️ Admin Dashboard</h1>

    <p>
        Movies, direct R2 uploads और ads को एक ही जगह manage करें।
    </p>
</div>

<div class="admin-actions">

    <a
        class="admin-home-btn"
        href="{{ url_for('admin') }}"
    >
        🏠 Dashboard
    </a>

    <a
        class="admin-logout-btn"
        href="{{ url_for('logout') }}"
    >
        🚪 Logout
    </a>

</div>

</div>

<!-- =========================================================
     STATS
========================================================= -->

<div class="admin-stats">

<div class="admin-stat-card">

    <div class="admin-stat-icon">
        🎬
    </div>

    <div>
        <span>Total Movies</span>

        <strong>
            {{ movies|length }}
        </strong>
    </div>

<
